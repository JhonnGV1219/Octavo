
{% extends 'principal/plantillaPrincipal.html' %}

{% block contenido %}

<h2>Editar Provincia</h2>

<form action="{% url 'procesarActualizacionProvincia' %}" method="POST">
    {% csrf_token %}

    <label>ID Provincia:</label>
    <input type="number" name="id_provincia"
           value="{{ miProvincia.id_provincia }}" readonly>

    <label>Nombre Provincia:</label>
    <input type="text" name="nombre_provincia"
           value="{{ miProvincia.nombre_provincia }}" required>

    <button type="submit">Actualizar Provincia</button>
    <a href="{% url 'showProvincia' %}">Cancelar</a>
</form>

{% endblock %}
