
{% extends 'principal/plantillaPrincipal.html' %}

{% block contenido %}

<h2>Registrar Estudiante</h2>

<form action="{% url 'guardarEstudiante' %}" method="POST">
    {% csrf_token %}

    <label>Apellidos:</label>
    <input type="text" name="apellido_est" maxlength="50" required>

    <label>Nombres:</label>
    <input type="text" name="nombre_est" maxlength="50" required>

    <label>Cédula:</label>
    <input type="text" name="cedula_est"
           maxlength="10" minlength="10"
           pattern="[0-9]{10}" required>

    <label>Cantón:</label>
    <select name="id_canton" required>
        <option value="">Seleccione un cantón</option>

        {% for canton in misCantones %}
        <option value="{{ canton.id_canton }}">
            {{ canton.nombre_canton }}
        </option>
        {% endfor %}
    </select>

    <label>Dirección:</label>
    <textarea name="direccion_est" required></textarea>

    <label>Fecha de nacimiento:</label>
    <input type="date" name="fecha_nacimiento_est" required>

    <label>Estado:</label>
    <select name="estado_est" required>
        <option value="ACTIVO">ACTIVO</option>
        <option value="INACTIVO">INACTIVO</option>
    </select>

    <button type="submit">Guardar Estudiante</button>
    <a href="{% url 'showEstudiante' %}">Cancelar</a>

</form>

{% endblock %}
